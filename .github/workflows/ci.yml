name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (prod)
        run: npm audit --omit=dev
      - name: Tests
        run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.mjs --version
          node src/cli.mjs --help > /dev/null
      - name: Detector end-to-end (leak exits 1, clean exits 0)
        run: |
          set -euo pipefail
          node scripts/make-fixtures.mjs
          node src/cli.mjs clean.pdf
          if node src/cli.mjs leaky.pdf; then
            echo "expected a non-zero exit for the leaky fixture"; exit 1
          fi

  # What ships has to run on Linux: the file mode of the bin, the bin link npm
  # creates, and the shebang are all invisible to a Windows checkout.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Installed bin runs from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkgtest" && cd "$RUNNER_TEMP/pkgtest"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/redact-lint-*.tgz --no-audit --no-fund
          ./node_modules/.bin/redact-lint --version

      # The README tells people to run `npx redact-lint`. npx is a thin wrapper
      # over npm exec, so this exercises the same bin resolution from a
      # directory that looks like a user's: no package.json of its own.
      - name: Documented command runs from a neutral directory
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball="$(ls "$GITHUB_WORKSPACE"/redact-lint-*.tgz | head -1)"
          echo "tarball=$tarball"
          test -f "$tarball"
          npm exec --yes --package="$tarball" -- redact-lint --version
          node "$GITHUB_WORKSPACE/scripts/make-fixtures.mjs" "$RUNNER_TEMP/fixtures"
          if npm exec --yes --package="$tarball" -- redact-lint "$RUNNER_TEMP/fixtures/leaky.pdf"; then
            echo "expected a non-zero exit for the leaky fixture"; exit 1
          fi
