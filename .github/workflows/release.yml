name: Release

# Publishing uses npm trusted publishing: this workflow exchanges a GitHub OIDC
# token for a short-lived npm credential, so no NPM_TOKEN secret exists and
# there is nothing to rotate or leak.
#
# One-time setup, after the first manual release:
#   npmjs.com -> redact-lint -> Settings -> Trusted Publisher -> GitHub Actions
#   organization: Kayforkind   repository: redact-lint
#   workflow: release.yml      environment: (leave blank)
# Then: git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    # Semver tags only: the moving major tag (`v1`) that action consumers pin to
    # must never start a publish, and its version guard would fail the run.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release and the moving major tag
  id-token: write # required for the OIDC exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Trusted publishing needs npm 11.5.1+; Node 24 ships a newer npm.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Version guard
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi
      - run: npm test
      - name: Publish
        # --provenance attaches a signed build statement tying the tarball to
        # this commit and workflow.
        run: npm publish --provenance --access public

      # Tags are cheap and easy to forget; a Release is what people actually
      # read. Notes come from the CHANGELOG section for this version: generated
      # notes compare against the moving `v1` tag and describe the wrong diff.
      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf("## [" + v + "]");
            if (start === -1) process.exit(0);
            const rest = text.slice(start);
            const next = rest.indexOf("\n## [", 1);
            process.stdout.write((next === -1 ? rest : rest.slice(0, next)).trim() + "\n");
          ' > release-notes.md
          echo "notes lines: $(wc -l < release-notes.md)"

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      # Action consumers pin `@v1`; without this the alias keeps serving the
      # action as it was on the first release, not as it is now.
      - name: Move the major version tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR" "$GITHUB_REF_NAME^{}"
          git push -f origin "$MAJOR"
