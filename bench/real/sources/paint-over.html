<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disclosure — paint over</title>
<style>
  @page { size: A4; margin: 20mm; }
  body { font: 12pt/1.5 Arial, sans-serif; color: #111; }
  h1 { font-size: 18pt; margin: 0 0 18px; }
  .line { position: relative; margin: 22px 0; }
  .bar { position: absolute; inset: 0; background: #000; z-index: 2; }
</style>
</head>
<body>
<h1>Quarterly disclosure</h1>
<p>This page is an ordinary report. One line was "redacted" by covering it.</p>
<div class="line"><span style="position:relative;z-index:1">SSN 123-45-6789 — Account holder: Jane Q. Public</span><span class="bar"></span></div>
<p>Contact: press office. Nothing else on this page is sensitive.</p>
</body>
</html>
